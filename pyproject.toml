[project]
name = "nano-banana-pro"
version = "0.1.0"
description = "Nano Banana Pro - AI Image Generation Plugin powered by Gemini"
authors = [
    {name = "16api.com", email = "contact@16api.com"}
]
requires-python = ">=3.12"
dependencies = [
    "dify_plugin>=0.3.0,<0.5.0",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/seven15980/Dify-Plugin-nano-banana-pro-"
Repository = "https://github.com/seven15980/Dify-Plugin-nano-banana-pro-"
Issues = "https://github.com/seven15980/Dify-Plugin-nano-banana-pro-/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
