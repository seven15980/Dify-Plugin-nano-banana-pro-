identity:
  author: 16api.com
  name: gemini_draw
  label:
    en_US: Nano Banana Pro
    zh_Hans: Nano Banana Pro
  description:
    en_US: AI Image Generation powered by Gemini. Supports text-to-image and image-to-image modes.
    zh_Hans: 基于 Gemini 的 AI 图像生成。支持文生图和图生图两种模式。
  icon: icon.svg

credentials_for_provider:
  api_key:
    type: secret-input
    required: true
    label:
      en_US: API Key
      zh_Hans: API 密钥
    placeholder:
      en_US: Enter your API Key from 16api.com
      zh_Hans: 输入你从 16api.com 获取的 API 密钥
    help:
      en_US: Register at https://www.16api.com to get your API Key
      zh_Hans: 在 https://www.16api.com 注册以获取 API 密钥
  base_url:
    type: text-input
    required: false
    default: "https://www.16api.com"
    label:
      en_US: API Base URL
      zh_Hans: API 基础地址
    placeholder:
      en_US: https://www.16api.com
      zh_Hans: https://www.16api.com
    help:
      en_US: Default is 16api.com, no need to change
      zh_Hans: 默认为 16api.com，无需修改

tools:
  - tools/ai_generate.yaml
