identity:
  author: api16
  name: gemini_draw
  label:
    en_US: Nano Banana Pro
    zh_Hans: Nano Banana Pro
  description:
    en_US: Generate and edit images with Nano Banana Pro (Gemini 3 Pro Image) through SteadyRouter, an independent API gateway not affiliated with Google.
    zh_Hans: 通过 SteadyRouter 用 Nano Banana Pro（Gemini 3 Pro Image）生成、修改图片。SteadyRouter 是独立的 API 网关，与 Google 没有关联。
  icon: icon.svg

credentials_for_provider:
  steadyrouter_api_key:
    type: secret-input
    required: false
    label:
      en_US: SteadyRouter API Key
      zh_Hans: SteadyRouter API Key
    placeholder:
      en_US: Paste your SteadyRouter API key
      zh_Hans: 粘贴你的 SteadyRouter API Key
    help:
      en_US: Get your API key from SteadyRouter
      zh_Hans: 从 SteadyRouter 获取 API Key
    url: https://www.steadyrouter.com/sign-up?aff=qpa5
  api_key:
    type: secret-input
    required: false
    label:
      en_US: Legacy 16api Key (only for users who upgraded from 0.1.x)
      zh_Hans: 旧版 16api 密钥（只给从 0.1.x 升级来的老用户）
    placeholder:
      en_US: Do not put a SteadyRouter key here. New users, leave this empty.
      zh_Hans: SteadyRouter 的 Key 别填这里，新用户留空
    help:
      en_US: Only for existing users who upgraded from 0.1.x. Do not put a SteadyRouter key here. If both fields are filled in, SteadyRouter is used.
      zh_Hans: 只给从 0.1.x 升级来的老用户，SteadyRouter 的 Key 别填这里。两个都填时走 SteadyRouter。

extra:
  python:
    source: provider/gemini_draw.py

tools:
  - tools/ai_generate.yaml
